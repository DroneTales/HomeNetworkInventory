{% extends "base.html" %}

{% block title %}{{ t('auth.change_password') }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-5 col-lg-4">
        <h1 class="mb-4">{{ t('auth.change_password') }}</h1>

        {% if must_change %}
        <div class="alert alert-warning">{{ t('auth.must_change') }}</div>
        {% endif %}

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" action="/change-password">
            <div class="mb-3">
                <label for="old_password" class="form-label">{{ t('auth.old_password') }}</label>
                <input type="password" class="form-control" id="old_password" name="old_password"
                       required autofocus autocomplete="current-password">
            </div>
            <div class="mb-3">
                <label for="new_password" class="form-label">{{ t('auth.new_password') }}</label>
                <input type="password" class="form-control" id="new_password" name="new_password"
                       required autocomplete="new-password">
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">{{ t('auth.confirm_password') }}</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                       required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">{{ t('common.save') }}</button>
        </form>
    </div>
</div>
{% endblock %}
