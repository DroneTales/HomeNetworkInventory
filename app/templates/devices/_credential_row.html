<div class="credential-row border rounded p-2 mb-2">
    <input type="hidden" name="credential_id" class="credential-id"
           value="{{ cred.id if cred and cred.id else '' }}">

    <div class="row g-2 align-items-end">
        <div class="col-6 col-md-3">
            <label class="form-label small mb-0">Type</label>
            <select class="form-select form-select-sm credential-type" name="credential_type_id">
                <option value="">—</option>
                {% set cur_type = cred.type_id if cred and cred.type_id else '' %}
                {% for ct in credential_types %}
                <option value="{{ ct.id }}"
                        {% if cur_type and cur_type|string == ct.id|string %}selected{% endif %}>
                    {{ ct.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-6 col-md-3">
            <label class="form-label small mb-0">Username</label>
            <input type="text" class="form-control form-control-sm credential-username"
                   name="credential_username"
                   value="{{ cred.username if cred and cred.username else '' }}"
                   placeholder="admin" maxlength="100">
        </div>
        <div class="col-12 col-md-4">
            <label class="form-label small mb-0">
                Password
                {% if not can_change_passwords %}
                <i class="fa-solid fa-lock text-muted ms-1" title="You cannot change this password"></i>
                {% endif %}
            </label>
            {% if can_view_passwords %}
            <input type="text" class="form-control form-control-sm credential-password"
                   name="credential_password"
                   value="{{ cred.password if cred and cred.password else '' }}"
                   maxlength="255"
                   {% if not can_change_passwords %}readonly{% endif %}>
            {% else %}
            <input type="password" class="form-control form-control-sm credential-password"
                   name="credential_password"
                   value=""
                   placeholder="••••••••"
                   maxlength="255"
                   readonly>
            {% endif %}
        </div>
        <div class="col-6 col-md-2 text-end">
            <button type="button" class="btn btn-sm btn-outline-danger remove-credential-btn">Remove</button>
        </div>
        <div class="col-12">
            <label class="form-label small mb-0">Description</label>
            <input type="text" class="form-control form-control-sm credential-description"
                   name="credential_description"
                   value="{{ cred.description if cred and cred.description else '' }}"
                   maxlength="255">
        </div>
    </div>
</div>
