<div class="port-row border rounded p-2 mb-2">
    <input type="hidden" name="port_id" class="port-id"
           value="{{ port.id if port and port.id else '' }}">

    <div class="row g-1 align-items-end">
        <div class="col-6 col-md-2">
            <label class="form-label small mb-0">{{ t('devices.form.field.name') }}</label>
            <input type="text" class="form-control form-control-sm port-name px-1"
                   name="port_name"
                   value="{{ port.name if port and port.name else '' }}"
                   placeholder="LAN1" maxlength="50" required>
        </div>
        <div class="col-6 col-md-3">
            <label class="form-label small mb-0">{{ t('devices.form.field.interface') }}</label>
            <select class="form-select form-select-sm port-interface px-1" name="port_interface_id"
                    data-selected="{{ port.interface_id if port and port.interface_id else '' }}" required>
                <option value="">—</option>
            </select>
        </div>
        <div class="col-12 col-md-5">
            <label class="form-label small mb-0">{{ t('devices.form.field.description') }}</label>
            <input type="text" class="form-control form-control-sm port-description px-1"
                   name="port_description"
                   value="{{ port.description if port and port.description else '' }}"
                   maxlength="255">
        </div>
        <div class="col-12 col-md-2 text-end">
            <button type="button" class="btn btn-sm btn-outline-danger remove-port-btn px-1">{{ t('devices.form.btn.remove') }}</button>
        </div>
    </div>
</div>
