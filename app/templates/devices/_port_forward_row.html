<div class="pf-row border rounded p-2 mb-2">
    <input type="hidden" name="pf_id" class="pf-id"
           value="{{ pf.id if pf and pf.id else '' }}">

    <div class="row g-1 align-items-end">
        <div class="col-12 col-md-1">
            <label class="form-label small mb-0">{{ t('devices.form.field.description') }}</label>
            <input type="text" class="form-control form-control-sm pf-description px-1"
                   name="pf_description"
                   value="{{ pf.description if pf and pf.description else '' }}">
        </div>
        <div class="col-6 col-md-1">
            <label class="form-label small mb-0" title="{{ t('devices.form.field.external_start') }}">{{ t('devices.form.field.external_start') }}</label>
            <input type="text" inputmode="numeric" pattern="[0-9]{1,5}" maxlength="5"
                   class="form-control form-control-sm pf-external-start px-1"
                   name="pf_external_start"
                   value="{{ pf.external_port_start if pf and pf.external_port_start else '' }}">
        </div>
        <div class="col-6 col-md-1">
            <label class="form-label small mb-0" title="{{ t('devices.form.field.external_end') }}">{{ t('devices.form.field.external_end') }}</label>
            <input type="text" inputmode="numeric" pattern="[0-9]{1,5}" maxlength="5"
                   class="form-control form-control-sm pf-external-end px-1"
                   name="pf_external_end"
                   value="{{ pf.external_port_end if pf and pf.external_port_end else '' }}">
        </div>
        <div class="col-6 col-md-1">
            <label class="form-label small mb-0">{{ t('devices.form.field.protocol') }}</label>
            {% set cur_proto = pf.protocol if pf and pf.protocol else 'tcp' %}
            <select class="form-select form-select-sm pf-protocol px-1" name="pf_protocol">
                <option value="tcp" {% if cur_proto == 'tcp' %}selected{% endif %}>tcp</option>
                <option value="udp" {% if cur_proto == 'udp' %}selected{% endif %}>udp</option>
                <option value="both" {% if cur_proto == 'both' %}selected{% endif %}>both</option>
            </select>
        </div>
        <div class="col-6 col-md-1">
            <label class="form-label small mb-0">{{ t('devices.form.field.target') }}</label>
            {% set cur_target = 'device' if pf and pf.internal_device_id else ('ip' if pf and pf.internal_ip_manual else 'device') %}
            <select class="form-select form-select-sm pf-target-type px-1" name="pf_target_type">
                <option value="device" {% if cur_target == 'device' %}selected{% endif %}>Device</option>
                <option value="ip" {% if cur_target == 'ip' %}selected{% endif %}>IP</option>
            </select>
        </div>
        <div class="col-12 col-md-3 pf-target-device-block">
            <label class="form-label small mb-0">{{ t('devices.form.field.internal_device') }}</label>
            <select class="form-select form-select-sm pf-internal-device-id px-1" name="pf_internal_device_id">
                <option value="">—</option>
                {% for d in all_devices %}
                <option value="{{ d.id }}"
                    {% if pf and pf.internal_device_id and pf.internal_device_id|string == d.id|string %}selected{% endif %}>
                    {{ d.hostname }}{% if d.human_readable_name %} ({{ d.human_readable_name }}){% endif %}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-12 col-md-3 pf-target-ip-block d-none">
            <label class="form-label small mb-0">{{ t('devices.form.field.internal_ip') }}</label>
            <input type="text" class="form-control form-control-sm pf-internal-ip-manual px-1"
                   name="pf_internal_ip_manual"
                   value="{{ pf.internal_ip_manual if pf and pf.internal_ip_manual else '' }}"
                   placeholder="192.168.1.10">
        </div>
        <div class="col-6 col-md-1">
            <label class="form-label small mb-0" title="{{ t('devices.form.field.internal_start') }}">{{ t('devices.form.field.internal_start') }}</label>
            <input type="text" inputmode="numeric" pattern="[0-9]{1,5}" maxlength="5"
                   class="form-control form-control-sm pf-internal-start px-1"
                   name="pf_internal_start"
                   value="{{ pf.internal_port_start if pf and pf.internal_port_start else '' }}">
        </div>
        <div class="col-6 col-md-1">
            <label class="form-label small mb-0" title="{{ t('devices.form.field.internal_end') }}">{{ t('devices.form.field.internal_end') }}</label>
            <input type="text" inputmode="numeric" pattern="[0-9]{1,5}" maxlength="5"
                   class="form-control form-control-sm pf-internal-end px-1"
                   name="pf_internal_end"
                   value="{{ pf.internal_port_end if pf and pf.internal_port_end else '' }}">
        </div>
        <div class="col-6 col-md-1">
            <div class="form-check mb-0">
                <input class="form-check-input pf-is-active" type="checkbox"
                       name="pf_is_active"
                       id="pf-active-{{ pf.id if pf and pf.id else 'new' }}-{{ loop.index0 if loop is defined else 0 }}"
                       {% if not pf or pf.is_active %}checked{% endif %}>
                <label class="form-check-label small" for="pf-active-{{ pf.id if pf and pf.id else 'new' }}-{{ loop.index0 if loop is defined else 0 }}">
                    {{ t('devices.form.field.active') }}
                </label>
            </div>
        </div>
        <div class="col-6 col-md-1 text-end">
            <button type="button" class="btn btn-sm btn-outline-danger remove-pf-btn px-1">{{ t('devices.form.btn.remove') }}</button>
        </div>
    </div>
</div>
